name: Publish signed release to R2

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version matching Cargo.toml (MAJOR.MINOR.PATCH)"
        required: true
      notes:
        description: "Release notes"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release --locked --bin spotiflex --bin spotiflex-release
      - name: Sign and publish
        env:
          SPOTIFLEX_RELEASE_SIGNING_KEY: ${{ secrets.SPOTIFLEX_RELEASE_SIGNING_KEY }}
          SPOTIFLEX_RELEASE_PUBLISH_TOKEN: ${{ secrets.SPOTIFLEX_RELEASE_PUBLISH_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          $releaseVersion = $env:RELEASE_VERSION
          if (-not $releaseVersion) { $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', '' }
          $releaseNotes = $env:RELEASE_NOTES
          if (-not $releaseNotes) { $releaseNotes = "SpotiFlex $releaseVersion" }
          [System.IO.File]::WriteAllText('release-notes.txt', $releaseNotes)
          & '.\target\release\spotiflex-release.exe' publish $releaseVersion '.\target\release\spotiflex.exe' 'release-notes.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
