name: Publish signed release to R2

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version matching Cargo.toml (MAJOR.MINOR.PATCH)"
        required: true
      notes:
        description: "Release notes"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release
        env:
          LYSSNA_SPICY_LYRICS_KEY: ${{ vars.LYSSNA_SPICY_LYRICS_KEY || vars.SPOTIFLEX_SPICY_LYRICS_KEY }}
        run: cargo build --release --locked --bin lyssna --bin lyssna-release
      - name: Sign and publish
        env:
          LYSSNA_RELEASE_SIGNING_KEY: ${{ secrets.LYSSNA_RELEASE_SIGNING_KEY || secrets.SPOTIFLEX_RELEASE_SIGNING_KEY }}
          LYSSNA_RELEASE_PUBLISH_TOKEN: ${{ secrets.LYSSNA_RELEASE_PUBLISH_TOKEN || secrets.SPOTIFLEX_RELEASE_PUBLISH_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          $releaseVersion = $env:RELEASE_VERSION
          if (-not $releaseVersion) { $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', '' }
          $releaseNotes = $env:RELEASE_NOTES
          if (-not $releaseNotes) { $releaseNotes = "Lyssna $releaseVersion" }
          [System.IO.File]::WriteAllText('release-notes.txt', $releaseNotes)
          # The tool uploads the build as releases/<version>/windows-x86_64/spotiflex.exe,
          # the object name installed copies accept, whatever the local file is called.
          & '.\target\release\lyssna-release.exe' publish $releaseVersion '.\target\release\lyssna.exe' 'release-notes.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
