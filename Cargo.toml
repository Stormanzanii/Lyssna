[package]
name = "spotiflex"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Native Rust Spotify client with synchronized lyrics and playlist tools"
license = "AGPL-3.0-only"
publish = false
default-run = "spotiflex"

[workspace]
members = ["vendor/librespot-playback","vendor/librespot-connect"]
default-members = ["."]

[features]
default = ["desktop", "custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-plugin-window-state"]
legacy-ui = ["dep:eframe", "dep:egui_extras", "dep:ttf-parser", "dep:tiny-skia"]

[dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
dotenvy = "0.15"
ed25519-dalek = "2.2"
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.33", optional = true, features = ["image", "http"] }
tauri = { version = "2", optional = true, features = ["image-ico"] }
tauri-plugin-window-state = { version = "2", optional = true }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service"] }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { version = "0.8", default-features = false }
librespot-playback = { version = "0.8", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
roxmltree = "0.21"
rodio = { version = "0.21", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
self-replace = "1.5"
semver = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
time = {version="0.3",features=["formatting","parsing"]}
url = "2"
webbrowser = "1"
ttf-parser = { version = "0.25.1", optional = true }
tiny-skia = { version = "0.11", optional = true, default-features = false, features = ["std", "simd"] }
librespot-protocol = "0.8"
protobuf = "3.7"

# Taskbar thumbnail buttons and the system media session.
[target.'cfg(windows)'.dependencies]
cpal = "0.16"
webrtc-vad = "0.4"
whisper-rs = "0.16"
souvlaki = { version = "0.8", default-features = false }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Speech", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
tauri-build = { version = "2", features = [] }

# Experimental DJ session paging and narration; upstream PR #1797.
# Pin the reviewed implementation so dependency resolution cannot follow branch changes.
[patch.crates-io]
librespot-audio = { git = "https://github.com/School-User/librespot.git", rev = "b199674d7c241eb82abce494f3f17a9d373b8d23" }
librespot-connect = { path = "vendor/librespot-connect" }
librespot-core = { git = "https://github.com/School-User/librespot.git", rev = "b199674d7c241eb82abce494f3f17a9d373b8d23" }
librespot-metadata = { git = "https://github.com/School-User/librespot.git", rev = "b199674d7c241eb82abce494f3f17a9d373b8d23" }
librespot-oauth = { git = "https://github.com/School-User/librespot.git", rev = "b199674d7c241eb82abce494f3f17a9d373b8d23" }
librespot-playback = { path = "vendor/librespot-playback" }
librespot-protocol = { git = "https://github.com/School-User/librespot.git", rev = "b199674d7c241eb82abce494f3f17a9d373b8d23" }

[profile.dev]
debug = 1

# Model verification hashes 190 MB on each on-demand load.
[profile.dev.package.sha2]
opt-level = 3

[patch."https://github.com/School-User/librespot.git"]
librespot-connect = { path = "vendor/librespot-connect" }
librespot-playback = { path = "vendor/librespot-playback" }

[profile.release]
lto = "thin"
strip = true
