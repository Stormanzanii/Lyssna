[package]
name = "spotiflex"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Native Rust Spotify client with synchronized lyrics and playlist tools"
license = "AGPL-3.0-only"
publish = false
default-run = "spotiflex"

[workspace]
members = ["vendor/librespot-core", "vendor/librespot-playback", "vendor/librespot-connect"]
default-members = ["."]

[features]
default = ["desktop", "custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-plugin-window-state", "dep:tauri-plugin-single-instance"]
legacy-ui = ["dep:eframe", "dep:egui_extras", "dep:ttf-parser", "dep:tiny-skia"]

[dependencies]
log = "0.4"
anyhow = "1"
base64 = "0.22"
directories = "6"
dotenvy = "0.15"
ed25519-dalek = "2.2"
flate2 = "1"
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.33", optional = true, features = ["image", "http"] }
tauri = { version = "2", optional = true, features = ["devtools", "image-ico", "tray-icon"] }
tauri-plugin-window-state = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { version = "0.8", default-features = false }
librespot-playback = { version = "0.8", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
roxmltree = "0.21"
arboard = { version = "3.7", default-features = false }
rodio = { version = "0.21", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
self-replace = "1.5"
semver = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
time = {version="0.3",features= ["formatting", "parsing"] }
url = "2"
webbrowser = "1"
ttf-parser = { version = "0.25.1", optional = true }
tiny-skia = { version = "0.11", optional = true, default-features = false, features = ["std", "simd"] }
librespot-protocol = "0.8"
protobuf = "3.7"

# Native microphone capture, local recognition and system media controls.
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3.6", features = ["windows-native", "sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
ring = "0.17"
zeroize = "1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = "0.16"
webrtc-vad = "0.4"
whisper-rs = "0.16"
souvlaki = { version = "0.8", default-features = false }

# Taskbar thumbnail buttons and WebView2 integration.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Speech", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
tauri-build = { version = "2", features = [] }

# Experimental DJ session paging and narration; upstream PR #1797.
# Pin the reviewed implementation so dependency resolution cannot follow branch changes.
[patch.crates-io]
# Restore custom macOS traffic lights after title changes and fullscreen exit.
# Upstream fix: https://github.com/tauri-apps/tao/pull/1254
tao = { git = "https://github.com/tauri-apps/tao", rev = "2ada91bf6372cd9fd3071377a1da90edee601f39" }
librespot-audio = { git = "https://github.com/School-User/librespot.git", rev = "b199674d7c241eb82abce494f3f17a9d373b8d23" }
librespot-connect = { path = "vendor/librespot-connect" }
librespot-core = { path = "vendor/librespot-core" }
librespot-metadata = { git = "https://github.com/School-User/librespot.git", rev = "b199674d7c241eb82abce494f3f17a9d373b8d23" }
librespot-oauth = { git = "https://github.com/School-User/librespot.git", rev = "b199674d7c241eb82abce494f3f17a9d373b8d23" }
librespot-playback = { path = "vendor/librespot-playback" }
librespot-protocol = { git = "https://github.com/School-User/librespot.git", rev = "b199674d7c241eb82abce494f3f17a9d373b8d23" }

[profile.dev]
debug = 1
# Incremental caches grew to tens of GB in target/debug/incremental.
incremental = false

# Model verification hashes 190 MB on each on-demand load.
[profile.dev.package.sha2]
opt-level = 3

[patch."https://github.com/School-User/librespot.git"]
librespot-connect = { path = "vendor/librespot-connect" }
librespot-core = { path = "vendor/librespot-core" }
librespot-playback = { path = "vendor/librespot-playback" }

[profile.release]
lto = "thin"
incremental = false
strip = true
